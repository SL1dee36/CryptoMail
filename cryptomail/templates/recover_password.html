{% extends "base.html" %}

{% block title %}CryptoMail{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="m3-card p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl m3-badge-warning mx-auto flex items-center justify-center mb-3">
                <i class="fa-solid fa-key text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Сброс пароля</h1>
            <p class="text-xs opacity-75 mt-1">Восстановление доступа</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3.5 rounded-xl m3-badge-error text-xs flex items-start space-x-2">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if success_message %}
        <div class="mb-5 p-3.5 rounded-xl m3-badge-success text-xs flex items-start space-x-2">
            <i class="fa-solid fa-check mt-0.5"></i>
            <span>{{ success_message }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/recover-password" class="space-y-4">
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-semibold uppercase tracking-wider opacity-80">Логин или Email</label>
                    <button type="submit" formaction="/recover-password/send-code" formnovalidate
                        class="text-xs font-semibold text-[var(--md-color-primary)] hover:underline flex items-center space-x-1">
                        <i class="fa-regular fa-paper-plane text-[10px]"></i>
                        <span>Выслать код</span>
                    </button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 opacity-50">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="email_or_username" required value="{{ email_or_username or '' }}"
                        placeholder="ivan_petrov или ivan@example.com" class="m3-input pl-10">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-semibold uppercase tracking-wider opacity-80">Код подтверждения</label>
                    <a href="/mailtrap" target="_blank"
                        class="text-xs font-semibold text-[var(--md-color-primary)] hover:underline flex items-center space-x-1">
                        <i class="fa-solid fa-inbox text-[10px]"></i>
                        <span>Сервисная почта</span>
                    </a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 opacity-50">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="text" name="verification_code" required placeholder="XXXX-XXXX или 6-значный OTP"
                        class="m3-input pl-10 mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 opacity-80">Новый
                    пароль</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 opacity-50">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="new_password" required placeholder="••••••••••••"
                        class="m3-input pl-10">
                </div>
            </div>

            <button type="submit" class="w-full mt-4 py-3 m3-btn-filled text-sm">
                Сбросить пароль
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-[var(--md-color-outline-variant)] text-center text-xs opacity-75">
            Вспомнили пароль?
            <a href="/login" class="text-[var(--md-color-primary)] font-medium ml-1 hover:underline">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
