{% extends "base.html" %}

{% block title %}CryptoMail{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-6">
    <div class="m3-card p-6 md:p-8">
        <div class="flex items-center justify-between pb-4 border-b border-[var(--md-color-outline-variant)] mb-6">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl m3-badge-primary flex items-center justify-center text-lg">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Новое сообщение</h1>
            </div>
            <a href="/" class="m3-btn-outlined py-1 px-3 text-xs">
                <i class="fa-solid fa-xmark"></i>
                <span>Отмена</span>
            </a>
        </div>

        {% if error %}
        <div class="mb-5 p-3.5 rounded-xl m3-badge-error text-xs flex items-start space-x-2">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form id="compose-form" method="POST" action="/messages/compose" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 opacity-80">Получатель</label>
                <select name="recipient_id" required class="m3-select">
                    <option value="" disabled selected>Выберите получателя...</option>
                    {% for u in potential_recipients %}
                    <option value="{{ u.id }}">{{ u.username }} ({{ u.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 opacity-80">Тема</label>
                <input type="text" name="subject" required placeholder="Тема сообщения..." class="m3-input">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 opacity-80">Шифрование</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <label
                        class="relative flex p-3.5 rounded-2xl border border-[var(--md-color-outline-variant)] bg-[var(--md-color-surface-container-low)] cursor-pointer hover:border-[var(--md-color-primary)] transition">
                        <input type="radio" name="encryption_type" value="RSA" checked class="mt-0.5"
                            onclick="document.getElementById('kuz-passphrase-block').classList.add('hidden')">
                        <div class="ml-2.5">
                            <span class="block text-xs font-bold text-[var(--md-color-primary)]">RSA</span>
                            <span class="block text-[11px] opacity-70 mt-0.5">Асимметричное шифрование</span>
                        </div>
                    </label>

                    <label
                        class="relative flex p-3.5 rounded-2xl border border-[var(--md-color-outline-variant)] bg-[var(--md-color-surface-container-low)] cursor-pointer hover:border-[var(--md-color-primary)] transition">
                        <input type="radio" name="encryption_type" value="KUZNYECHIK-256" class="mt-0.5"
                            onclick="document.getElementById('kuz-passphrase-block').classList.remove('hidden')">
                        <div class="ml-2.5">
                            <span class="block text-xs font-bold text-[var(--md-color-warning)]">Кузнечик (ГОСТ)</span>
                            <span class="block text-[11px] opacity-70 mt-0.5">Симметричное блочное шифрование</span>
                        </div>
                    </label>
                </div>
            </div>

            <div id="kuz-passphrase-block"
                class="hidden p-4 rounded-2xl border border-[var(--md-color-warning)] bg-[var(--md-color-surface-container-low)] space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider opacity-80">Кодовая фраза
                    (необязательно)</label>
                <input type="text" name="kuz_passphrase" id="kuz_passphrase"
                    placeholder="Оставьте пустым для персонального ключа..." class="m3-input font-mono text-xs">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 opacity-80">Текст
                    сообщения</label>
                <textarea name="body" rows="6" required placeholder="Введите текст сообщения..."
                    class="m3-textarea font-sans"></textarea>
            </div>

            <button type="submit" class="w-full py-3 m3-btn-filled text-sm">
                <i class="fa-solid fa-paper-plane mr-2"></i>
                <span>Отправить</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
